spring.profiles.include=env
spring.application.name=demo

server.port = 8080

spring.datasource.url=jdbc:mysql://localhost:3306/quizlet_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile,https://www.googleapis.com/auth/drive.file,https://www.googleapis.com/auth/spreadsheets
spring.security.oauth2.client.registration.google.provider=google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent

# JWT Configuration
app.jwt.secret=QuizletBackendSecretKeyForJWTSigningRequirementMinimum256BitsLong123456
app.jwt.expiration-ms=86400000

