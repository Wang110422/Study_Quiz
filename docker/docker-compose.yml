version: '3.8'

services:
  mysql-db:
    image: mysql:8
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network

  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - mysql-db
    networks:
      - app_network
  backend_python:
    build:
      context: ../Backend_python
      dockerfile: Dockerfile
    container_name: backend_python
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - ../Backend_python/.env
      - ../.env
    environment:
      - BANDAI_JOB_URL=${BANDAI_JOB_URL}
      - BANDAI_TOKEN=${BANDAI_TOKEN}
      - BANDAI_MODEL=${BANDAI_MODEL}
      - DEFAULT_GOOGLE_API_KEY=${GOOGLE_API_KEY}
    networks:
      - app_network
  backend_java:
    build:
      context: ../Backend
      dockerfile: Dockerfile
    container_name: backend_java
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ../Backend/.env
      - ../.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_URL=jdbc:mysql://${DB_HOST:-mysql-db}:3306/${DB_NAME:-quizlet_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DB_HOST:-mysql-db}:3306/${DB_NAME:-quizlet_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mysql-db
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
