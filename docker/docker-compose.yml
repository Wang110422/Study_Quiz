version: '3.8'

services:
  mysql-db:
    image: mysql:8
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-quizlet_db}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network

  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "3000:5173"
    depends_on:
      - mysql-db
    networks:
      - app_network
  backend_python:
    build:
      context: ../Backend_python
      dockerfile: Dockerfile
    container_name: backend_python
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - ../Backend_python/.env
      - ../.env
    environment:
      - BANDAI_JOB_URL=${BANDAI_JOB_URL:-https://paddleocr.aistudio-app.com/api/v2/ocr/jobs}
      - BANDAI_TOKEN=${BANDAI_TOKEN:-1d4a9cc70271f482b22714a41e440cccc26f2483}
      - BANDAI_MODEL=${BANDAI_MODEL:-PP-OCRv6}
      - DEFAULT_GOOGLE_API_KEY=${GOOGLE_API_KEY}
    networks:
      - app_network
  backend_java:
    build:
      context: ../Backend
      dockerfile: Dockerfile
    container_name: backend_java
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ../Backend/.env
      - ../.env
    environment:
      - DB_HOST=${DB_HOST:-mysql-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-quizlet_db}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-123456}
      - DB_URL=jdbc:mysql://${DB_HOST:-mysql-db}:3306/${DB_NAME:-quizlet_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DB_HOST:-mysql-db}:3306/${DB_NAME:-quizlet_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-336876017791-8r50vqspamk1301f1e0vk9jvtlg3o40l.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-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}
      - JWT_SECRET=${JWT_SECRET:-QuizletBackendSecretKeyForJWTSigningRequirementMinimum256BitsLong123456}
    depends_on:
      - mysql-db
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
